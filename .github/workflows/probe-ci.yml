name: Probe CI

on:
  push:
    paths:
      - "probe/**"
      - ".github/workflows/probe-ci.yml"
  pull_request:
    paths:
      - "probe/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
